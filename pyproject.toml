[project]
name = "chatbot"
version = "0.2.3"
description = "Offline Gemma forensic-genetics chatbot with prepared answers and RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "chromadb>=1.5.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langgraph>=1.0.10",
    "loguru>=0.7.3",
    "openai>=2.26.0",
    "pillow>=12.1.1",
    "pypdf>=6.0.0",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests against live services (requires: make start)",
    "performance: performance benchmarks against live services (requires: make start)",
]
# chromadb telemetry uses a deprecated asyncio API that is slated for removal in
# Python 3.16; it is third-party code we cannot change, so silence it here.
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning:chromadb.telemetry.opentelemetry",
]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
]
