x-model-environment: &model-environment
  LLAMA_API_KEY: ${LLAMA_API_KEY:?Set LLAMA_API_KEY}

x-chatbot-environment: &chatbot-environment
  LLAMA_BASE_URL: http://llama-server:8080/v1
  LLAMA_API_KEY: ${LLAMA_API_KEY:?Set LLAMA_API_KEY}
  LLAMA_MODEL_NAME: ${LLAMA_MODEL_NAME:?Set LLAMA_MODEL_NAME}
  LLAMA_MAX_OUTPUT_TOKENS: ${LLAMA_MAX_OUTPUT_TOKENS:-2048}
  LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
  LLAMA_TEMPERATURE: ${LLAMA_TEMPERATURE:-0.3}
  LLAMA_TOP_P: ${LLAMA_TOP_P:-0.9}
  LLAMA_TOP_K: ${LLAMA_TOP_K:-10}
  LLAMA_PRESENCE_PENALTY: ${LLAMA_PRESENCE_PENALTY:-0.0}
  LLAMA_REPEAT_PENALTY: ${LLAMA_REPEAT_PENALTY:-1.05}
  EMBEDDING_BASE_URL: http://embedding-server:8080/v1
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?Set EMBEDDING_MODEL_NAME}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  CHROMA_HOST: chromadb
  CHROMA_PORT: 8000
  CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-chatbot_knowledge}
  CHROMA_FIGURE_COLLECTION_NAME: ${CHROMA_FIGURE_COLLECTION_NAME:-chatbot_figures}
  FIGURES_DIR: /app/data/figures
  FIGURE_DESCRIPTION_MAX_TOKENS: ${FIGURE_DESCRIPTION_MAX_TOKENS:-512}
  DOMAIN_MIN_CONFIDENCE: ${DOMAIN_MIN_CONFIDENCE:-0.65}
  DOMAIN_MIN_MARGIN: ${DOMAIN_MIN_MARGIN:-0.03}
  DOMAIN_HIGH_RISK_THRESHOLD: ${DOMAIN_HIGH_RISK_THRESHOLD:-0.80}
  RAG_TOP_K: ${RAG_TOP_K:-5}
  RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.85}
  RAG_MAX_CHARS: ${RAG_MAX_CHARS:-2000}
  HISTORY_TURN_LIMIT: ${HISTORY_TURN_LIMIT:-4}
  STARTUP_MAX_ATTEMPTS: ${STARTUP_MAX_ATTEMPTS:-30}
  STARTUP_RETRY_SECONDS: ${STARTUP_RETRY_SECONDS:-2}
  API_HOST: 0.0.0.0
  API_PORT: 8080
  API_AUTH_ENABLED: "true"
  API_KEYS_FILE: /run/secrets/api_keys.json
  API_DOCS_ENABLED: "false"
  API_MAX_CONCURRENT_REQUESTS: ${API_MAX_CONCURRENT_REQUESTS:-1}
  API_QUEUE_TIMEOUT_SECONDS: ${API_QUEUE_TIMEOUT_SECONDS:-900}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ANONYMIZED_TELEMETRY: "FALSE"

services:
  llama-server:
    image: ${LLAMA_CPU_IMAGE:?Set LLAMA_CPU_IMAGE}
    pull_policy: never
    command: >
      -m /models/${LLAMA_MODEL_NAME}
      --mmproj /models/${MMPROJ_MODEL}
      --model-draft /models/${MTP_MODEL_NAME}
      --spec-type draft-mtp
      --spec-draft-n-max ${LLAMA_SPEC_DRAFT_N_MAX:-2}
      --api-key ${LLAMA_API_KEY}
      --port 8080
      --host 0.0.0.0
      --ctx-size ${LLAMA_CTX_SIZE:-8192}
      --batch-size ${LLAMA_BATCH_SIZE:-512}
      --ubatch-size ${LLAMA_UBATCH_SIZE:-512}
      --threads ${LLAMA_THREADS:-8}
      --threads-batch ${LLAMA_THREADS:-8}
      --n-gpu-layers ${LLAMA_GPU_LAYERS:-0}
      --n-gpu-layers-draft ${LLAMA_GPU_LAYERS_DRAFT:-0}
      --flash-attn on
      --jinja
      --no-mmap
      --cont-batching
      --reasoning off
      --parallel ${LLAMA_PARALLEL:-1}
    environment: *model-environment
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR}:/models:ro,z
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ${LLAMA_API_KEY}' http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  embedding-server:
    image: ${LLAMA_CPU_IMAGE:?Set LLAMA_CPU_IMAGE}
    pull_policy: never
    command: >
      -m /models/${EMBEDDING_MODEL_NAME}
      --embedding
      --api-key ${EMBEDDING_API_KEY}
      --port 8080
      --host 0.0.0.0
      --pooling mean
      --ctx-size ${EMBEDDING_CTX_SIZE:-2048}
      --batch-size ${EMBEDDING_BATCH_SIZE:-2048}
      --ubatch-size ${EMBEDDING_UBATCH_SIZE:-2048}
      --threads 8
      --threads-batch 8
      --n-gpu-layers ${EMBEDDING_GPU_LAYERS:-0}
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR}:/models:ro,z
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ${EMBEDDING_API_KEY}' http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  postgres:
    image: chatbot-bca/postgres:57c72fd2a128
    pull_policy: never
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    expose: ["5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  chromadb:
    image: chatbot-bca/chromadb:1e0b73a187a2
    pull_policy: never
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    expose: ["8000"]
    volumes:
      - ${RUNTIME_DIR:?Set RUNTIME_DIR}/chromadb:/data:Z
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  indexer:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    pull_policy: never
    group_add: ["${HOST_GID:?Set HOST_GID}"]
    command: ["python", "-m", "src.index_documents"]
    environment: *chatbot-environment
    volumes:
      - ${INSTALL_DIR:?Set INSTALL_DIR}/data/figures:/app/data/figures:ro,z
    depends_on:
      postgres: {condition: service_healthy}
      chromadb: {condition: service_healthy}
      llama-server: {condition: service_healthy}
      embedding-server: {condition: service_healthy}
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  chatbot:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    pull_policy: never
    group_add: ["${HOST_GID:?Set HOST_GID}"]
    environment: *chatbot-environment
    volumes:
      - ${INSTALL_DIR:?Set INSTALL_DIR}/data/figures:/app/data/figures:ro,z
      - ${CONFIG_DIR:?Set CONFIG_DIR}/auth:/run/secrets:ro,Z
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
      chromadb: {condition: service_healthy}
      llama-server: {condition: service_healthy}
      embedding-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  proxy:
    image: chatbot-bca/nginx:65645c7bb6a0
    pull_policy: never
    group_add: ["${HOST_GID:?Set HOST_GID}"]
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
    volumes:
      - ${CONFIG_DIR:?Set CONFIG_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      chatbot: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres_data: {}
