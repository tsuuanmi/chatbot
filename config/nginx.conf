events {}

http {
    log_format minimal '$remote_addr - $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log minimal;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=chat_per_ip:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream chatbot_api {
        server chatbot:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 12m;
        client_body_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1600s;
        proxy_send_timeout 60s;

        location = /api/v1/live {
            proxy_pass http://chatbot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/chat/stream {
            limit_req zone=chat_per_ip burst=3 nodelay;
            limit_conn streams_per_ip 2;
            proxy_pass http://chatbot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;
        }

        location /api/ {
            limit_req zone=chat_per_ip burst=3 nodelay;
            proxy_pass http://chatbot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
