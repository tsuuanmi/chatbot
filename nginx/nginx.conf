worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format minimal
        '$remote_addr - $request_method $uri $status $request_time';

    access_log /dev/stdout minimal;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    # Per-client-IP abuse guard. The model/runtime capacity controls
    # expensive inference concurrency; this limit protects the HTTP
    # gateway while still allowing normal UI/API bursts.
    limit_req_zone
        $binary_remote_addr
        zone=chat_per_ip:10m
        rate=120r/m;

    limit_conn_zone
        $binary_remote_addr
        zone=streams_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;

    upstream chatbot_api {
        server chatbot:1416;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_hide_header Server;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;

        location = /live {
            proxy_pass http://chatbot_api;
            proxy_read_timeout 5s;
        }

        location = /ready {
            proxy_pass http://chatbot_api;
            proxy_read_timeout 10s;
        }

        location = /api/v1/chat {
            client_max_body_size 10m;
            limit_req zone=chat_per_ip burst=30 nodelay;

            proxy_pass http://chatbot_api;
            proxy_read_timeout 600s;
        }

        location = /api/v1/chat/stream {
            client_max_body_size 10m;
            limit_req zone=chat_per_ip burst=30 nodelay;
            limit_conn streams_per_ip 2;

            proxy_pass http://chatbot_api;

            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;

            proxy_read_timeout 600s;
        }

        location ^~ /api/v1/conversations/ {
            proxy_pass http://chatbot_api;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
